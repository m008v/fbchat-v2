services:
  fbchat-provider:
    build:
      context: .
      dockerfile: Dockerfile
    image: fbchat-v2-provider:local
    restart: unless-stopped
    init: true
    environment:
      FBCHAT_HOST: 0.0.0.0
      FBCHAT_PORT: ${FBCHAT_PORT:-8080}
      FBCHAT_E2EE_REQUIRED: ${FBCHAT_E2EE_REQUIRED:-true}
      FBCHAT_API_AUTH_REQUIRED: "true"
      FBCHAT_API_USERNAME: ${FBCHAT_API_USERNAME:?set FBCHAT_API_USERNAME}
      FBCHAT_API_PASSWORD: ${FBCHAT_API_PASSWORD:?set FBCHAT_API_PASSWORD}
      FBCHAT_STATE_DIR: /var/lib/fbchat
    ports:
      - "${FBCHAT_HOST_PORT:-127.0.0.1:8088}:${FBCHAT_PORT:-8080}"
    volumes:
      - fbchat_state:/var/lib/fbchat
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  fbchat_state:
