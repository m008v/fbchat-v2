[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "fbchat-v2"
version = "2.3.2"
description = "Async-first, account-based Python library for the unofficial Facebook Messenger API with E2EE support."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "MinhHuyDev", email = "minhhuydev@protonmail.com" },
]
maintainers = [
    { name = "MinhHuyDev", email = "minhhuydev@protonmail.com" },
]
keywords = [
    "facebook",
    "messenger",
    "fbchat",
    "messenger-api",
    "e2ee",
    "labyrinth",
    "chatbot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "paho-mqtt>=1.6.1",
    "pyotp>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/MinhHuyDev/fbchat-v2"
Documentation = "https://github.com/MinhHuyDev/fbchat-v2/blob/main/DOCS.md"
Repository = "https://github.com/MinhHuyDev/fbchat-v2"
Issues = "https://github.com/MinhHuyDev/fbchat-v2/issues"
Changelog = "https://github.com/MinhHuyDev/fbchat-v2/blob/main/CHANGELOG.md"
Telegram = "https://t.me/MinhHuyDev"

[project.optional-dependencies]
e2ee = []
dev = [
    "build>=1.2.0",
    "twine>=5.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black",
    "mypy>=1.11.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fbchat_v2"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/fbchat_v2/**",
    "/README.md",
    "/README_EN.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/config.json",
    "/build/**",
    "/dist/**",
    "/.artifacts/**",
    "/tests/**",
    "/.venv*/**",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Ruff bắt các lỗi parser/runtime-critical; Black chịu trách nhiệm định dạng.
select = ["E9", "F"]

[tool.black]
target-version = ["py310"]
line-length = 88
extend-exclude = "src/fbchat_v2/_messaging/_bridge_checksums.py"

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
mypy_path = ["src"]
ignore_missing_imports = true
warn_unused_configs = true
files = ["src/fbchat_v2"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
