name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing tag to rebuild missing assets; dispatch this workflow from the same tag ref
        required: true
        default: v2.3.2

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONUTF8: '1'

concurrency:
  group: release-${{ github.repository }}-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-release:
    name: Validate release tag and package version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_INPUT_TAG: ${{ inputs.tag_name }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
            tag="$RELEASE_INPUT_TAG"
          else
            tag="$RELEASE_REF_NAME"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([._+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Capture immutable release commit
        id: source
        shell: bash
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          source_sha="$(git rev-parse HEAD)"
          expected_ref="refs/tags/${RELEASE_TAG}"
          if [[ "$EVENT_REF" != "$expected_ref" ]]; then
            echo "Release workflow must run from $expected_ref; got $EVENT_REF." >&2
            exit 1
          fi
          if [[ "$EVENT_SHA" != "$source_sha" ]]; then
            echo "Release tag moved after trigger: event=$EVENT_SHA checkout=$source_sha." >&2
            exit 1
          fi
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Match tag to package version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: python scripts/release_artifacts.py validate --release-tag "$RELEASE_TAG"
      - name: Require matching release notes
        env:
          RELEASE_NOTES: .github/RELEASE_NOTES_${{ steps.release.outputs.tag }}.md
        shell: bash
        run: test -f "$RELEASE_NOTES"

  quality-gate:
    name: Verify release source
    needs: resolve-release
    uses: ./.github/workflows/quality-gate.yml
    with:
      checkout_ref: ${{ needs.resolve-release.outputs.sha }}
    permissions:
      contents: read

  build-go-binaries:
    name: Build E2EE bridge (${{ matrix.goos }}-${{ matrix.goarch }})
    needs: [resolve-release, quality-gate]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release source and submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          persist-credentials: false
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bridge-e2ee/go.mod
          cache-dependency-path: bridge-e2ee/go.sum
          check-latest: false
      - name: Set up Python for native release smoke
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Build bridge
        working-directory: bridge-e2ee
        env:
          CGO_ENABLED: '0'
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
          TARGET_ARCH: ${{ matrix.goarch }}
          TARGET_OS: ${{ matrix.goos }}
        shell: bash
        run: |
          mkdir -p ../build
          output_name="fbchat-bridge-e2ee-${TARGET_OS}-${TARGET_ARCH}"
          if [[ "$TARGET_OS" == "windows" ]]; then
            output_name="${output_name}.exe"
          fi
          release_version="${RELEASE_TAG#v}"
          GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
            go build -trimpath \
              -ldflags="-s -w -X main.bridgeVersion=${release_version}" \
              -o "../build/${output_name}" .
      - name: Exercise release binary JSON-RPC contract
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          BRIDGE_BINARY: build/fbchat-bridge-e2ee-linux-amd64
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        shell: bash
        run: >-
          python scripts/smoke_bridge_rpc.py "$BRIDGE_BINARY"
          --expected-version "${RELEASE_TAG#v}"
      - name: Attest bridge provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/fbchat-bridge-e2ee-*
      - name: Upload bridge artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fbchat-bridge-e2ee-${{ matrix.goos }}-${{ matrix.goarch }}
          path: build/fbchat-bridge-e2ee-*
          if-no-files-found: error
          retention-days: 7

  assemble-release:
    name: Build and verify final release artifacts
    needs: [resolve-release, build-go-binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install release tooling
        run: >-
          python -m pip install --disable-pip-version-check
          "build==1.5.0" "hatchling==1.32.0" "twine==7.0.0"
      - name: Download bridge artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: all-binaries
          pattern: fbchat-bridge-e2ee-*
          merge-multiple: true
      - name: Bind bridge checksums
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: >-
          python scripts/release_artifacts.py bind
          --release-tag "$RELEASE_TAG"
          --binaries-dir all-binaries
          --module src/_messaging/_bridge_checksums.py
          --manifest all-binaries/SHA256SUMS
      - name: Synchronize canonical package snapshot
        run: python scripts/sync_canonical_package.py
      - name: Build wheel and sdist
        run: python -m build --no-isolation --outdir dist
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Verify embedded bridge checksums
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: >-
          python scripts/release_artifacts.py verify
          --release-tag "$RELEASE_TAG"
          --binaries-dir all-binaries
          --dist-dir dist
          --manifest all-binaries/SHA256SUMS
      - name: Smoke-test final wheel and sdist
        shell: bash
        run: |
          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist_path="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$wheel_path"
          test -n "$sdist_path"

          python -m venv .venv-release-wheel
          .venv-release-wheel/bin/python -m pip install --disable-pip-version-check "$wheel_path"
          .venv-release-wheel/bin/python scripts/verify_distribution.py "$wheel_path"

          python -m venv .venv-release-sdist
          .venv-release-sdist/bin/python -m pip install --disable-pip-version-check "$sdist_path"
          .venv-release-sdist/bin/python scripts/verify_distribution.py "$sdist_path"
      - name: Record Python distribution checksums
        shell: bash
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS-python
      - name: Attest Python distributions
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Upload verified bridge assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-bridge-assets
          path: all-binaries/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified Python distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  upload-github-release-assets:
    name: Publish verified GitHub Release assets
    needs: [resolve-release, assemble-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.resolve-release.outputs.sha }}
          persist-credentials: false
      - name: Download verified bridge assets
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verified-bridge-assets
          path: verified-assets
      - name: Download verified Python distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: verified-python-distributions
          path: verified-assets
      - name: Re-verify downloaded release payload
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          test "$(find verified-assets -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 9
          test -z "$(find verified-assets -mindepth 1 -maxdepth 1 ! -type f -print -quit)"
          (
            cd verified-assets
            sha256sum --check SHA256SUMS
            sha256sum --check SHA256SUMS-python
          )
          python scripts/release_artifacts.py verify \
            --release-tag "$RELEASE_TAG" \
            --binaries-dir verified-assets \
            --dist-dir verified-assets \
            --manifest verified-assets/SHA256SUMS
      - name: Reject stale same-name release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          status="$(curl --silent --show-error --location \
            --output existing-release.json \
            --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          if [[ "$status" == '404' ]]; then
            printf '{"assets":[]}' > existing-release.json
          elif [[ "$status" != '200' ]]; then
            echo "GitHub release lookup failed with HTTP $status" >&2
            exit 1
          fi
          python -c "import hashlib,json,pathlib,sys; data=json.load(open('existing-release.json',encoding='utf-8')); local={path.name:'sha256:'+hashlib.sha256(path.read_bytes()).hexdigest() for path in pathlib.Path('verified-assets').iterdir() if path.is_file()}; existing={item['name']:item.get('digest') for item in data.get('assets',[])}; extras=sorted(existing.keys()-local.keys()); collisions=[(name,existing[name],local[name]) for name in sorted(existing.keys()&local.keys()) if existing[name] != local[name]]; print(*('unexpected existing release asset '+name for name in extras),*('stale release asset '+name+': '+str(actual)+' != '+expected for name,actual,expected in collisions),sep='\n',file=sys.stderr); sys.exit(bool(extras or collisions))"
      - name: Reconfirm immutable release tag before upload
        shell: bash
        env:
          EXPECTED_SHA: ${{ needs.resolve-release.outputs.sha }}
          RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
        run: |
          verification_ref="refs/codex-release-verification/${RELEASE_TAG}"
          git fetch --force --no-tags origin \
            "refs/tags/${RELEASE_TAG}:${verification_ref}"
          current_sha="$(git rev-parse "${verification_ref}^{commit}")"
          if [[ "$current_sha" != "$EXPECTED_SHA" ]]; then
            echo "Release tag moved before upload: expected=$EXPECTED_SHA current=$current_sha" >&2
            exit 1
          fi
      - name: Upload assets without overwriting existing files
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve-release.outputs.tag }}
          target_commitish: ${{ needs.resolve-release.outputs.sha }}
          files: verified-assets/*
          body_path: .github/RELEASE_NOTES_${{ needs.resolve-release.outputs.tag }}.md
          fail_on_unmatched_files: true
          overwrite_files: false
