name: Reusable quality gate

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or tag to verify; empty uses the caller SHA
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONUTF8: '1'

jobs:
  python-quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install development dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Verify canonical package snapshot
        run: python scripts/sync_canonical_package.py --check
      - name: Compile Python sources
        run: python -m compileall -q src tests scripts
      - name: Run Ruff
        run: ruff check src tests scripts
      - name: Check Python formatting
        run: black --check src tests scripts
      - name: Type-check source and release tooling
        shell: bash
        run: |
          mypy
          MYPYPATH=src mypy --explicit-package-bases src/fbchat_v2
      - name: Set up Node.js when website source is tracked
        if: ${{ hashFiles('website/script.js') != '' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check website JavaScript syntax
        if: ${{ hashFiles('website/script.js') != '' }}
        run: node --check website/script.js
      - name: Report unavailable website source
        if: ${{ hashFiles('website/script.js') == '' }}
        run: echo "website/script.js is not tracked; JavaScript syntax check skipped."

  python-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  python-windows:
    name: Python 3.11 tests (Windows)
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Run pytest on Windows
        run: python -m pytest tests/ -v --tb=short

  package-smoke:
    name: Wheel and sdist smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Build and inspect distributions
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "build==1.5.0" "hatchling==1.32.0" "twine==7.0.0"
          python scripts/sync_canonical_package.py --check
          python -m build --no-isolation --outdir dist
          python -m twine check --strict dist/*

          wheel_path="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist_path="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$wheel_path"
          test -n "$sdist_path"

          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --disable-pip-version-check "$wheel_path"
          .venv-wheel/bin/python scripts/verify_distribution.py "$wheel_path"

          python -m venv .venv-sdist
          .venv-sdist/bin/python -m pip install --disable-pip-version-check "$sdist_path"
          .venv-sdist/bin/python scripts/verify_distribution.py "$sdist_path"

  go-quality:
    name: Go tests, vet, and race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
          submodules: recursive
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bridge-e2ee/go.mod
          cache-dependency-path: bridge-e2ee/go.sum
          check-latest: false
      - name: Run Go tests
        working-directory: bridge-e2ee
        run: go test -count=1 ./...
      - name: Run Go vet
        working-directory: bridge-e2ee
        run: go vet ./...
      - name: Scan reachable Go vulnerabilities
        working-directory: bridge-e2ee
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Run Go race detector
        working-directory: bridge-e2ee
        env:
          CGO_ENABLED: '1'
        run: go test -race -count=1 ./...

  native-bridge-smoke:
    name: Native bridge RPC (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            suffix: ''
          - platform: windows
            runner: windows-2025
            suffix: '.exe'
          - platform: macos
            runner: macos-15
            suffix: ''
    steps:
      - name: Check out source and submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.checkout_ref }}
          persist-credentials: false
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: bridge-e2ee/go.mod
          cache-dependency-path: bridge-e2ee/go.sum
          check-latest: false
      - name: Build native bridge
        shell: bash
        working-directory: bridge-e2ee
        env:
          BRIDGE_SUFFIX: ${{ matrix.suffix }}
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../build
          go build -trimpath -o "../build/fbchat-bridge-e2ee${BRIDGE_SUFFIX}" .
      - name: Exercise native JSON-RPC process
        shell: bash
        env:
          BRIDGE_BINARY: build/fbchat-bridge-e2ee${{ matrix.suffix }}
        run: >-
          python scripts/smoke_bridge_rpc.py "$BRIDGE_BINARY"
          --expected-version "2.3.2"
